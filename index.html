<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sujan Acharya | Golden Vault</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Montserrat:wght@300;500;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            overflow: hidden;
            background-color: #050505;
            font-family: 'Montserrat', sans-serif;
            color: #d4af37;
            /* Gold */
        }

        #canvas-coontainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            background: radial-gradient(circle at center, #1a1a00 0%, #000000 100%);
        }

        /* --- UI Overlay --- */
        #ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        /* Header */
        .header {
            position: absolute;
            top: 40px;
            left: 40px;
            pointer-events: auto;
            border-left: 5px solid #d4af37;
            padding-left: 20px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 3.5rem;
            font-weight: 900;
            color: transparent;
            background: linear-gradient(to bottom, #cfc09f 22%, #634f2c 24%, #cfc09f 26%, #cfc09f 27%, #ffecb3 40%, #3a2c0f 78%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.5));
            letter-spacing: 5px;
        }

        .subtitle {
            font-size: 1.2rem;
            letter-spacing: 3px;
            color: #ffd700;
            text-transform: uppercase;
            margin-top: 5px;
            font-weight: 700;
        }

        /* Top Right Links */
        .nav-bar {
            position: absolute;
            top: 40px;
            right: 40px;
            display: flex;
            gap: 30px;
            pointer-events: auto;
        }

        .nav-link {
            font-family: 'Cinzel', serif;
            color: #ffd700;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 700;
            border: 1px solid #d4af37;
            padding: 10px 20px;
            transition: 0.3s;
            background: rgba(0, 0, 0, 0.5);
        }

        .nav-link:hover {
            background: #d4af37;
            color: #000;
            box-shadow: 0 0 20px #d4af37;
        }

        /* Info Card (Gold Card) */
        #info-card {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(120%);
            width: 90%;
            max-width: 600px;
            background: linear-gradient(135deg, rgba(20, 20, 20, 0.95), rgba(40, 30, 10, 0.95));
            border: 2px solid #d4af37;
            padding: 30px;
            text-align: center;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: auto;
            box-shadow: 0 0 50px rgba(212, 175, 55, 0.2);
            border-radius: 10px;
        }

        #info-card.active {
            transform: translateX(-50%) translateY(0);
        }

        #card-title {
            font-family: 'Cinzel', serif;
            font-size: 2/5rem;
            color: #ffd700;
            margin-bottom: 10px;
            border-bottom: 1px solid #d4af37;
            padding-bottom: 10px;
            display: inline-block;
        }

        #card-desc {
            font-size: 1rem;
            line-height: 1.6;
            color: #eee;
            margin-bottom: 20px;
        }

        .skill-pill {
            display: inline-block;
            background: linear-gradient(45deg, #d4af37, #b8860b);
            color: #000;
            padding: 5px 15px;
            margin: 5px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.5);
        }

        #close-card {
            position: absolute;
            top: 10px;
            right: 15px;
            color: #d4af37;
            cursor: pointer;
            font-size: 1.5rem;
        }

        /* Tip */
        .tip {
            position: absolute;
            bottom: 20px;
            right: 40px;
            color: rgba(255, 215, 0, 0.5);
            font-size: 0.8rem;
        }
    </style>
    <!-- Three.js -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>
    <div id="ui-layer">
        <header class="header">
            <h1>SUJAN ACHARYA</h1>
            <div class="subtitle">AI / ML ENGINEER | GOLD STANDARD</div>
        </header>

        <nav class="nav-bar">
            <a href="https://github.com/sujan-acharya" class="nav-link" target="_blank">GITHUB</a>
            <a href="mailto:sujan.acharya@example.com" class="nav-link">EMAIL</a>
        </nav>

        <div id="info-card">
            <div id="close-card" onclick="closeCard()">✕</div>
            <h2 id="card-title">PROJECT NAME</h2>
            <p id="card-desc">Description goes here.</p>
            <div id="card-skills"></div>
        </div>

        <div class="tip">DRAG TO ROTATE • CLICK COINS FOR DETAILS</div>
    </div>

    <div id="canvas-coontainer"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Config ---
        const config = {
            coinRadius: 2.5,
            coinThick: 0.4,
            orbitRadius: 10
        };

        // --- Data ---
        const items = [
            {
                id: 'skills',
                emoji: '⚡',
                name: 'CORE SKILLS',
                desc: 'My technical arsenal for building advanced AI systems.',
                tags: ['C++', 'Django', 'Machine Learning', 'Data Science', 'Python']
            },
            {
                id: 'nerf',
                emoji: '🤖',
                name: 'NeRF Engine',
                desc: 'Neural Radiance Fields. 3D scene reconstruction from photos using deep learning.',
                tags: ['PyTorch', '3D Vision']
            },
            {
                id: 'ipo',
                emoji: '📈',
                name: 'MaximumIPO',
                desc: 'Stock market prediction using LSTMs to analyze IPO trends.',
                tags: ['FinTech', 'Time Series']
            },
            {
                id: 'video',
                emoji: '🎬',
                name: 'Video Captioning',
                desc: 'Generating real-time captions for video content using NLP.',
                tags: ['Transformers', 'OpenCV']
            },
            {
                id: 'med',
                emoji: '💊',
                name: 'Medicine Rec',
                desc: 'AI-powered pill identification and dosage assistant.',
                tags: ['Healthcare', 'CNN']
            },
            {
                id: 'var',
                emoji: '⚙️',
                name: 'VAR Automation',
                desc: 'Industrial automation and anomaly detection systems.',
                tags: ['Automation', 'Robotics']
            },
            {
                id: 'contact',
                emoji: '🤙',
                name: 'Contact Me',
                desc: 'Let\'s build something legendary together.',
                tags: ['Email', 'Collaboration']
            }
        ];

        // --- Init ---
        const container = document.getElementById('canvas-coontainer');
        const scene = new THREE.Scene();
        // Fog for atmosphere
        scene.fog = new THREE.FogExp2(0x111100, 0.02);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 5, 25);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = true;
        controls.autoRotateSpeed = 0.5;

        // --- Lighting (Warm Gold) ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const spotLight = new THREE.SpotLight(0xffd700, 200);
        spotLight.position.set(10, 20, 10);
        spotLight.castShadow = true;
        scene.add(spotLight);

        const pointLight = new THREE.PointLight(0xffaa00, 10, 50);
        pointLight.position.set(-10, -10, 5);
        scene.add(pointLight);

        // --- Materials ---
        const goldMaterial = new THREE.MeshStandardMaterial({
            color: 0xffd700,
            metalness: 1.0,
            roughness: 0.3,
            envMapIntensity: 1.0
        });

        const sideMaterial = new THREE.MeshStandardMaterial({
            color: 0xb8860b,
            metalness: 1.0,
            roughness: 0.2,
            flatShading: true
        });

        // --- Helper: Create Emoji Texture ---
        function createEmojiTexture(emoji) {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');

            // Gold Background for face
            const grad = ctx.createRadialGradient(256, 256, 50, 256, 256, 256);
            grad.addColorStop(0, '#ffd700');
            grad.addColorStop(1, '#b8860b');
            ctx.fillStyle = grad;
            ctx.fillRect(0, 0, 512, 512);

            // Emoji
            ctx.font = '300px serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = '#000'; // Emboss effect (simplified as black)
            ctx.fillText(emoji, 256, 280); // Offset for better centering?

            // Ring
            ctx.lineWidth = 20;
            ctx.strokeStyle = '#634f2c';
            ctx.beginPath();
            ctx.arc(256, 256, 240, 0, Math.PI * 2);
            ctx.stroke();

            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        // --- Create Coins ---
        const coins = [];
        const group = new THREE.Group();
        scene.add(group);

        const count = items.length;
        const radius = 9; // Radius of layout

        items.forEach((item, i) => {
            const angle = (i / count) * Math.PI * 2;

            const x = Math.cos(angle) * radius;
            const z = Math.sin(angle) * radius;

            // Texture
            const faceTex = createEmojiTexture(item.emoji);
            const faceMat = new THREE.MeshStandardMaterial({
                map: faceTex,
                metalness: 0.5,
                roughness: 0.1
            });

            // Geometry: Cylinder
            // RadiusTop, RadiusBottom, Height, Segments
            const geometry = new THREE.CylinderGeometry(config.coinRadius, config.coinRadius, config.coinThick, 64);
            // rotate geometry to face outward
            geometry.rotateX(Math.PI / 2);

            // [Side, Face, Face]
            const mesh = new THREE.Mesh(geometry, [sideMaterial, faceMat, faceMat]);

            mesh.position.set(x, 0, z);
            mesh.lookAt(0, 0, 0); // Face center

            mesh.userData = { id: item.id, data: item };
            group.add(mesh);
            coins.push(mesh);
        });

        // --- Gold Dust Particles ---
        const particlesGeo = new THREE.BufferGeometry();
        const pCount = 2000;
        const pPos = new Float32Array(pCount * 3);
        const pMat = new THREE.PointsMaterial({
            color: 0xffd700,
            size: 0.1,
            transparent: true,
            opacity: 0.6
        });

        for (let i = 0; i < pCount * 3; i++) {
            pPos[i] = (Math.random() - 0.5) * 40;
        }
        particlesGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        const particleSystem = new THREE.Points(particlesGeo, pMat);
        scene.add(particleSystem);


        // --- Interaction ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        window.addEventListener('click', onMouseClick);
        window.addEventListener('mousemove', onMouseMove);

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        }

        function onMouseClick(event) {
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(coins);

            if (intersects.length > 0) {
                const item = intersects[0].object.userData.data;
                showCard(item);
            }
        }

        function showCard(item) {
            const card = document.getElementById('info-card');
            document.getElementById('card-title').textContent = item.name;
            document.getElementById('card-desc').textContent = item.desc;

            const skillsDiv = document.getElementById('card-skills');
            skillsDiv.innerHTML = item.tags.map(t => `<span class="skill-pill">${t}</span>`).join('');

            card.classList.add('active');
            controls.autoRotate = false; // Stop rotating so they can read
        }

        window.closeCard = function () {
            document.getElementById('info-card').classList.remove('active');
            controls.autoRotate = true; // Resume
        }


        // --- Animation ---
        function animate() {
            requestAnimationFrame(animate);

            controls.update();

            // Rotate coins locally
            coins.forEach(coin => {
                coin.rotation.z += 0.01; // Spin face
            });

            // Float particles
            particleSystem.rotation.y += 0.001;

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();

    </script>
</body>

</html>
