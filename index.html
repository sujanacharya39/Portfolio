<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sujan Acharya | Neural Universe</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            overflow: hidden;
            background-color: #000;
            font-family: 'Rajdhani', sans-serif;
            color: #fff;
        }

        #canvas-coontainer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* --- UI Overlay --- */
        #ui-layer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
            /* Let clicks pass through to 3D */
            background: radial-gradient(circle at center, transparent 0%, rgba(0, 0, 0, 0.8) 120%);
        }

        /* Header / Identity */
        .header {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            opacity: 1;
            transition: all 1s ease;
            pointer-events: auto;
        }

        .header.minimized {
            top: 50px;
            left: 50px;
            transform: translate(0, 0);
            text-align: left;
            scale: 0.7;
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 6rem;
            font-weight: 900;
            letter-spacing: 15px;
            color: #fff;
            text-transform: uppercase;
            /* Heavy Glow on Letters */
            text-shadow:
                0 0 10px #0ff,
                0 0 20px #0ff,
                0 0 40px #0ff,
                0 0 80px #00f,
                0 0 120px #00f;
            animation: textPulse 3s infinite alternate;
        }

        .subtitle {
            font-size: 1.5rem;
            letter-spacing: 8px;
            color: #0ff;
            text-transform: uppercase;
            margin-top: 10px;
            text-shadow: 0 0 10px #0ff;
            background: rgba(0, 0, 0, 0.5);
            display: inline-block;
            padding: 5px 20px;
            border: 1px solid #0ff;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
        }

        @keyframes textPulse {
            0% {
                text-shadow: 0 0 10px #0ff, 0 0 20px #0ff, 0 0 40px #0ff;
            }

            100% {
                text-shadow: 0 0 20px #0ff, 0 0 40px #0ff, 0 0 80px #0ff, 0 0 100px #00f;
            }
        }

        /* Navigation */
        .nav-bar {
            position: absolute;
            top: 40px;
            right: 50px;
            display: flex;
            gap: 40px;
            pointer-events: auto;
        }

        .nav-link {
            font-family: 'Orbitron', sans-serif;
            color: #fff;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 2px;
            position: relative;
            transition: 0.3s;
            text-shadow: 0 0 10px #f0f;
        }

        .nav-link::before {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0%;
            height: 2px;
            background: #f0f;
            transition: 0.3s;
            box-shadow: 0 0 10px #f0f;
        }

        .nav-link:hover {
            color: #f0f;
            text-shadow: 0 0 20px #f0f, 0 0 40px #f0f;
        }

        .nav-link:hover::before {
            width: 100%;
        }

        /* Info Panel (Holographic HUD) */
        #info-panel {
            position: absolute;
            right: 0;
            top: 0;
            width: 400px;
            height: 100%;
            background: rgba(0, 10, 20, 0.85);
            border-left: 2px solid #0ff;
            transform: translateX(100%);
            transition: transform 0.5s cubic-bezier(0.77, 0, 0.175, 1);
            backdrop-filter: blur(10px);
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: -20px 0 50px rgba(0, 255, 255, 0.2);
            pointer-events: auto;
        }

        #info-panel.active {
            transform: translateX(0);
        }

        #info-content h2 {
            font-family: 'Orbitron';
            font-size: 2.5rem;
            color: #0ff;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #0ff;
            border-bottom: 2px solid #f0f;
            padding-bottom: 15px;
        }

        #info-content p {
            font-size: 1.1rem;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #ddd;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.5);
        }

        .tech-tag {
            display: inline-block;
            padding: 5px 15px;
            margin: 5px;
            border: 1px solid #f0f;
            color: #f0f;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.3);
        }

        #close-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 2rem;
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
        }

        #close-btn:hover {
            color: #f0f;
            text-shadow: 0 0 10px #f0f;
        }

        /* Instructions */
        .instructions {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            letter-spacing: 3px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.3;
            }

            50% {
                opacity: 1;
            }
        }

        /* Loading */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #000;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            transition: opacity 1s ease;
        }

        .loader-text {
            font-family: 'Orbitron';
            font-size: 2rem;
            color: #0ff;
            text-shadow: 0 0 20px #0ff;
            letter-spacing: 5px;
            margin-bottom: 20px;
        }

        .loader-bar {
            width: 300px;
            height: 4px;
            background: #111;
            position: relative;
            overflow: hidden;
        }

        .loader-progress {
            position: absolute;
            top: 0;
            left: 0;
            height: 100%;
            width: 0%;
            background: #0ff;
            box-shadow: 0 0 20px #0ff;
            animation: load 2s ease-in-out forwards;
        }

        @keyframes load {
            0% {
                width: 0%;
            }

            100% {
                width: 100%;
            }
        }

        @media(max-width: 768px) {
            h1 {
                font-size: 3rem;
                letter-spacing: 5px;
            }

            .header.minimized {
                left: 20px;
                top: 20px;
                scale: 0.5;
                transform-origin: top left;
            }

            #info-panel {
                width: 100%;
            }

            .nav-bar {
                width: 100%;
                justify-content: center;
                right: 0;
                background: rgba(0, 0, 0, 0.8);
                top: 0;
                padding: 10px 0;
            }
        }
    </style>
    <!-- Three.js from CDN -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>

<body>

    <div id="loader">
        <div class="loader-text">INITIALIZING NEURAL CORE...</div>
        <div class="loader-bar">
            <div class="loader-progress"></div>
        </div>
    </div>

    <!-- UI Layer -->
    <div id="ui-layer">
        <nav class="nav-bar">
            <a href="https://github.com/sujan-acharya" class="nav-link" target="_blank">GITHUB</a>
            <a href="mailto:sujan.acharya@example.com" class="nav-link">EMAIL</a>
            <a href="#" class="nav-link" onclick="openContact()">CONTACT</a>
        </nav>

        <div class="header">
            <h1>SUJAN ACHARYA</h1>
            <div class="subtitle">AI / ML ENGINEER | COMPUTER ENGINEERING STUDENT</div>
        </div>

        <div class="instructions">[ CLICK PLANETS TO EXPLORE DATA NODES ]</div>

        <!-- Info Panel -->
        <div id="info-panel">
            <div id="close-btn" onclick="closeInfo()">✕</div>
            <div id="info-content">
                <!-- Content injected via JS -->
            </div>
        </div>
    </div>

    <!-- 3D Canvas -->
    <div id="canvas-coontainer"></div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // --- Config ---
        const config = {
            bloomStrength: 1.5,
            bloomRadius: 0.4,
            bloomThreshold: 0,
            coreSize: 2,
            orbitSpeed: 0.002
        };

        // --- Data: Projects / Planets ---
        const projects = [
            {
                id: 'nerf',
                name: 'NeRF ENGINE',
                desc: 'Neural Radiance Fields implementation. Reconstructing 3D scenes from 2D images using deep neural networks. Creating volumetric representations with view-dependent radiance.',
                tech: ['Python', 'PyTorch', 'CUDA', '3D Vision'],
                color: 0xff3300,
                size: 0.8,
                distance: 8,
                speed: 0.005,
                angle: 0
            },
            {
                id: 'ipo',
                name: 'MaximumIPO',
                desc: 'Stock market prediction engine specializing in IPO performance analysis. Utilizing LSTM/Transformer architectures to forecast market trends and opening prices.',
                tech: ['TensorFlow', 'Pandas', 'Timeseries', 'FinTech'],
                color: 0x00ff00,
                size: 0.6,
                distance: 12,
                speed: 0.003,
                angle: 2
            },
            {
                id: 'video',
                name: 'VIDEO CAPTIONING',
                desc: 'Multimodal AI system that watches videos and generates accurate, context-aware captions in real-time. Bridges Computer Vision and NLP.',
                tech: ['Transformers', 'OpenCV', 'NLP', 'React'],
                color: 0x0066ff,
                size: 0.7,
                distance: 15,
                speed: 0.004,
                angle: 4
            },
            {
                id: 'med',
                name: 'MEDICINE RECOGNITION',
                desc: 'Mobile-first AI doctor assistant. Identifies pills and medications from camera images, providing dosage info and contraindications instantly.',
                tech: ['CNN', 'MobileNet', 'HealthTech', 'Flutter'],
                color: 0xff00ff,
                size: 0.5,
                distance: 19,
                speed: 0.002,
                angle: 5
            },
            {
                id: 'var',
                name: 'VAR AUTOMATION',
                desc: 'Industrial automation toolkit utilizing Variable Auto-Regressive models for complex system control and anomaly detection.',
                tech: ['Robotics', 'Control Systems', 'C++', 'Python'],
                color: 0xffff00,
                size: 0.9,
                distance: 22,
                speed: 0.001,
                angle: 1
            },
            {
                id: 'contact',
                name: 'CONTACT SIGNAL',
                desc: 'Establish a secure link. Open for collaborations, freelance, and research opportunities.',
                tech: ['Email', 'LinkedIn', 'Signal'],
                color: 0xffffff,
                size: 0.4,
                distance: 25,
                speed: 0.006,
                angle: 3
            }
        ];

        // --- Init ---
        const container = document.getElementById('canvas-coontainer');
        const scene = new THREE.Scene();
        // Fog for depth
        scene.fog = new THREE.FogExp2(0x000000, 0.02);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.z = 30;
        camera.position.y = 10;

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        container.appendChild(renderer.domElement);

        // --- Controls ---
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 50;
        controls.minDistance = 5;

        // --- Post Processing (BLOOM) ---
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = config.bloomThreshold;
        bloomPass.strength = config.bloomStrength;
        bloomPass.radius = config.bloomRadius;

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- Objects ---

        // 1. The Core (Sun/Identity)
        const coreGeo = new THREE.IcosahedronGeometry(config.coreSize, 4);
        const coreMat = new THREE.MeshBasicMaterial({
            color: 0x00ffff,
            wireframe: true,
            transparent: true,
            opacity: 0.3
        });
        const core = new THREE.Mesh(coreGeo, coreMat);
        scene.add(core);

        // Inner glowing solid core
        const coreInnerGeo = new THREE.IcosahedronGeometry(config.coreSize * 0.6, 2);
        const coreInnerMat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
        const coreInner = new THREE.Mesh(coreInnerGeo, coreInnerMat);
        core.add(coreInner);

        // 2. Planets (Orbs)
        const planetMeshes = [];
        const orbitLines = [];

        projects.forEach(p => {
            // Orbit path (Ring)
            const orbitGeo = new THREE.RingGeometry(p.distance - 0.05, p.distance + 0.05, 64);
            const orbitMat = new THREE.MeshBasicMaterial({
                color: 0xffffff,
                side: THREE.DoubleSide,
                transparent: true,
                opacity: 0.1
            });
            const orbit = new THREE.Mesh(orbitGeo, orbitMat);
            orbit.rotation.x = Math.PI / 2;
            scene.add(orbit);
            orbitLines.push(orbit);

            // Planet Group (Pivot)
            const pivot = new THREE.Object3D();
            scene.add(pivot);

            // Planet Mesh
            const geometry = new THREE.SphereGeometry(p.size, 32, 32);
            const material = new THREE.MeshStandardMaterial({
                color: p.color,
                emissive: p.color,
                emissiveIntensity: 2,
                roughness: 0.4,
                metalness: 0.8
            });
            const mesh = new THREE.Mesh(geometry, material);

            // Initial Position
            mesh.position.x = p.distance;

            pivot.add(mesh);

            // Metadata for interaction
            mesh.userData = {
                isPlanet: true,
                project: p,
                pivot: pivot,
                originalScale: p.size
            };

            planetMeshes.push(mesh);
        });

        // 3. Stars (Particles)
        const starGeo = new THREE.BufferGeometry();
        const starCount = 5000;
        const starPos = new Float32Array(starCount * 3);

        for (let i = 0; i < starCount * 3; i++) {
            starPos[i] = (Math.random() - 0.5) * 200;
        }

        starGeo.setAttribute('position', new THREE.BufferAttribute(starPos, 3));
        const starMat = new THREE.PointsMaterial({
            size: 0.1,
            color: 0xffffff,
            transparent: true,
            opacity: 0.8
        });
        const stars = new THREE.Points(starGeo, starMat);
        scene.add(stars);

        // --- Lights ---
        const pointLight = new THREE.PointLight(0xffffff, 2, 100);
        pointLight.position.set(0, 0, 0);
        scene.add(pointLight);

        const ambientLight = new THREE.AmbientLight(0x404040);
        scene.add(ambientLight);

        // --- Interaction ---
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let hoveredObject = null;

        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
        });

        window.addEventListener('click', (event) => {
            if (hoveredObject) {
                focusOnPlanet(hoveredObject);
            } else {
                // Clicking void resets view?
                // resetView();
            }
        });

        function focusOnPlanet(mesh) {
            const p = mesh.userData.project;

            // Move Camera
            // We'll just minimize header and show info panel
            document.querySelector('.header').classList.add('minimized');

            // Populate Info
            const panel = document.getElementById('info-content');
            panel.innerHTML = `
                <h2 style="color: #${p.color.toString(16)}">${p.name}</h2>
                <p>${p.desc}</p>
                <div style="margin-top: 20px;">
                    ${p.tech.map(t => `<span class="tech-tag" style="border-color: #${p.color.toString(16)}; color: #${p.color.toString(16)}">${t}</span>`).join('')}
                </div>
            `;

            // Show Panel
            document.getElementById('info-panel').classList.add('active');
        }

        window.closeInfo = function () {
            document.getElementById('info-panel').classList.remove('active');
            document.querySelector('.header').classList.remove('minimized');
        };

        window.openContact = function () {
            // Find contact planet and trigger focus
            const contactPlanet = planetMeshes.find(m => m.userData.project.id === 'contact');
            if (contactPlanet) focusOnPlanet(contactPlanet);
        };

        // --- Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            // Core Pulse
            const scale = 1 + Math.sin(time * 2) * 0.1;
            core.scale.set(scale, scale, scale);
            core.rotation.y += 0.005;
            core.rotation.z += 0.002;

            // Planet Orbits
            planetMeshes.forEach(mesh => {
                const p = mesh.userData.project;
                mesh.userData.pivot.rotation.y += p.speed;

                // Self rotate
                mesh.rotation.y += 0.02;
            });

            // Stars Movement (Warp effect)
            stars.rotation.y -= 0.0005;

            // Raycasting
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(planetMeshes);

            if (intersects.length > 0) {
                if (hoveredObject !== intersects[0].object) {
                    hoveredObject = intersects[0].object;
                    document.body.style.cursor = 'pointer';
                    // Hover scale effect
                    hoveredObject.scale.set(hoveredObject.userData.originalScale * 1.5, hoveredObject.userData.originalScale * 1.5, hoveredObject.userData.originalScale * 1.5);
                }
            } else {
                if (hoveredObject) {
                    // Reset scale
                    hoveredObject.scale.set(hoveredObject.userData.originalScale, hoveredObject.userData.originalScale, hoveredObject.userData.originalScale);
                    hoveredObject = null;
                    document.body.style.cursor = 'default';
                }
            }

            controls.update();
            composer.render();
        }

        // --- Resize ---
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });

        // Start
        setTimeout(() => {
            document.getElementById('loader').style.opacity = '0';
            setTimeout(() => document.getElementById('loader').remove(), 1000);
        }, 2000);

        animate();
    </script>
</body>

</html>
